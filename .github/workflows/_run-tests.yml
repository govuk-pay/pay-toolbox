name: Github Actions Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Detect secrets
        uses: govuk-pay/pay-ci/actions/detect-secrets@2f600380181d780f79bc92c3f648a23c6f2ab17d # 0.0.2

  install-and-compile:
    uses: govuk-pay/pay-ci/.github/workflows/_run-node-install-and-compile.yml@2f600380181d780f79bc92c3f648a23c6f2ab17d # 0.0.2

  unit-tests:
    needs: [ install-and-compile ]
    uses: govuk-pay/pay-ci/.github/workflows/_run-node-unit-tests-and-publish-pacts.yml@2f600380181d780f79bc92c3f648a23c6f2ab17d # 0.0.2

  check-docker-base-images-are-manifests:
    uses: govuk-pay/pay-ci/.github/workflows/_validate_docker_image_is_manifest.yml@2f600380181d780f79bc92c3f648a23c6f2ab17d # 0.0.2
